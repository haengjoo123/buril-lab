        <p>시약명이나 CAS 번호로 폐시약 폐기 기준과 GHS 주의사항을 확인하고, 3D 시약장·재고·폐기 기록을 한곳에서 관리하는 연구실 안전 관리 서비스입니다.</p>
        <h2>주요 기능</h2>
        <ul>
          <li>시약명·CAS 번호·제품명으로 폐시약 폐기 기준 검색</li>
          <li>KOSHA MSDS·PubChem 기반 GHS 주의사항 확인</li>
          <li>시약병 라벨 사진 인식과 음성 질문</li>
          <li>3D 시약장 보관 위치 관리</li>
          <li>시약 재고와 폐기 기록 관리 및 내보내기</li>
          <li>기관 안전관리자를 위한 통합안전관리센터</li>
        </ul>
        <h2>자주 묻는 질문</h2>
        <dl>
          <dt>버릴랩은 어떤 서비스인가요?</dt>
          <dd>버릴랩은 연구실에서 쓰고 남은 시약(폐시약)을 어떻게 폐기해야 하는지 찾아보고, 시약 재고와 시약장 보관 위치, 폐기 기록을 함께 관리하는 연구실 안전 관리 서비스입니다.</dd>
          <dt>시약은 어떻게 검색하나요?</dt>
          <dd>시약명(국문·영문), CAS 번호, 제품명으로 검색할 수 있습니다. 시약병 라벨을 카메라로 찍어 인식하거나 음성으로 질문할 수도 있습니다.</dd>
          <dt>폐기 기준과 GHS 정보는 어디에서 가져오나요?</dt>
          <dd>한국산업안전보건공단(KOSHA) MSDS와 PubChem 같은 공개 자료를 바탕으로 GHS 주의사항과 폐액 분류 방향을 보여줍니다. 참고 정보이므로 실제 폐기 전에는 최신 MSDS와 소속 기관의 폐기물 처리 규정을 함께 확인해야 합니다.</dd>
          <dt>이용 요금이 있나요?</dt>
          <dd>현재 모든 기능을 무료로 제공하며 결제를 받지 않습니다. 유료 기능을 도입하게 되면 결제 전에 가격과 환불 조건을 먼저 안내합니다.</dd>
          <dt>통합안전관리센터는 누가 사용하나요?</dt>
          <dd>대학·기관의 안전관리 담당자가 승인된 여러 연구실의 만료 임박 시약, 고위험 재고, 확인 요청 응답 현황을 한 화면에서 보고 점검 자료를 내보낼 때 사용합니다.</dd>
