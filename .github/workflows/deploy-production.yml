name: Deploy production manually

run-name: Deploy production ${{ inputs.commit_sha }} (lease=${{ inputs.lease_id }})

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Lowercase full SHA already deployed and verified on Staging
        required: true
        type: string
      confirmation:
        description: Type "DEPLOY buril-lab production <SHA> STAGING <RUN_ID> LEASE <LEASE> WITH EPHEMERAL TOKENS"
        required: true
        type: string
      staging_run_id:
        description: Exact successful and cleaned Staging workflow run approved for this production release
        required: true
        type: string
      lease_id:
        description: Fresh 32-character lowercase hex lease prepared by the cleanup supervisor
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  build:
    name: Build exact Production artifact without deployment credentials
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-release-artifact.outputs.artifact-id }}
      artifact_service_digest: ${{ steps.upload-release-artifact.outputs.artifact-digest }}
      manifest_sha256: ${{ steps.release-artifact-manifest.outputs.manifest_sha256 }}
    env:
      BASH_ENV: /dev/null
      ENV: /dev/null
      NODE_OPTIONS: ""
      DEPLOY_ENVIRONMENT: production
      DEPLOY_COMMIT_SHA: ${{ inputs.commit_sha }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_APP_URL: https://burillab.com
      VITE_INTERNAL_API_BASE_URL: https://burillab.com
      VITE_AUTH_REDIRECT_URL: https://burillab.com/auth/callback
      VITE_ENABLE_WASTE_V2: ${{ vars.VITE_ENABLE_WASTE_V2 }}
      VITE_ENABLE_PH_PREDICTION: ${{ vars.VITE_ENABLE_PH_PREDICTION }}
      VITE_ENABLE_CHEMICAL_ENRICHMENT: ${{ vars.VITE_ENABLE_CHEMICAL_ENRICHMENT }}
      VITE_ENABLE_SEARCH_ANALYTICS: ${{ vars.VITE_ENABLE_SEARCH_ANALYTICS }}

    steps:
      - name: Validate the credential-free Production build request
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REPOSITORY" != "haengjoo123/buril-lab" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production artifacts must be built by a manual dispatch from protected main" >&2
            exit 1
          fi
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "Workflow re-runs are forbidden; dispatch a new run" >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_COMMIT_SHA" =~ ^[0-9a-f]{40}$ || "$DEPLOY_COMMIT_SHA" != "$GITHUB_SHA" ]]; then
            echo "Production build must target the exact lowercase main SHA that dispatched this workflow" >&2
            exit 1
          fi

      - name: Check out the exact Production build commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the Production build commit is current main
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$DEPLOY_COMMIT_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$DEPLOY_COMMIT_SHA"

      - name: Set up Node.js for the Production build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked Production build dependencies
        run: npm ci --ignore-scripts

      - name: Build the production artifact
        run: npm run build

      - name: Compile Production Pages Functions without deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test ! -e dist/_worker.js
          test ! -e dist/_routes.json
          test -x "$GITHUB_WORKSPACE/node_modules/.bin/wrangler"
          "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" pages functions build functions \
            --outdir "$GITHUB_WORKSPACE/dist/_worker.js" \
            --output-routes-path "$GITHUB_WORKSPACE/dist/_routes.json" \
            --compatibility-date 2026-08-24 \
            --compatibility-flag nodejs_compat
          test -s dist/_worker.js/index.js
          node scripts/verify-pages-functions-routes.mjs dist/_routes.json
          if [[ -n "$(/usr/bin/find dist/_worker.js -mindepth 1 ! -type f ! -type d -print -quit)" ]]; then
            echo "Compiled Production Pages Worker contains an unsupported file type" >&2
            exit 1
          fi

      - name: Attach and verify the public release identity
        shell: bash
        run: |
          node scripts/write-release-manifest.mjs \
            --output dist/release.json \
            --commit "$DEPLOY_COMMIT_SHA" \
            --environment production \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/verify-release-manifest.mjs \
            --file dist/release.json \
            --commit "$DEPLOY_COMMIT_SHA" \
            --environment production

      - name: Create the exact Production artifact manifest
        id: release-artifact-manifest
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d dist ]] || [[ -n "$(/usr/bin/find dist -mindepth 1 ! -type f ! -type d -print -quit)" ]]; then
            echo "Production artifact must contain only regular files and directories" >&2
            exit 1
          fi
          /usr/bin/find dist -type f -print0 | node scripts/verify-release-artifact-paths.mjs
          /usr/bin/find dist -type f -print0 \
            | LC_ALL=C /usr/bin/sort -z \
            | /usr/bin/xargs -0 /usr/bin/sha256sum > .release-artifact.sha256
          test -s .release-artifact.sha256
          manifest_sha256="$(/usr/bin/sha256sum .release-artifact.sha256 | /usr/bin/cut -d ' ' -f 1)"
          [[ "$manifest_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload the exact Production release artifact
        id: upload-release-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: buril-lab-production-${{ inputs.commit_sha }}
          path: |
            dist
            .release-artifact.sha256
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          overwrite: false

  deploy:
    name: Manually deploy verified commit to buril-lab
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://burillab.com
    env:
      BASH_ENV: /dev/null
      ENV: /dev/null
      NODE_OPTIONS: ""
      DEPLOY_ENVIRONMENT: production
      DEPLOY_COMMIT_SHA: ${{ inputs.commit_sha }}
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
      DEPLOY_LEASE_ID: ${{ inputs.lease_id }}
      DEPLOY_STAGING_RUN_ID: ${{ inputs.staging_run_id }}
      DEPLOY_STORAGE_BACKUP: "false"
      EPHEMERAL_LEASE_GRANT: ${{ vars.EPHEMERAL_LEASE_GRANT }}
      EPHEMERAL_CLEANUP_RECEIPT: ${{ vars.EPHEMERAL_CLEANUP_RECEIPT }}
      STAGING_EPHEMERAL_CLEANUP_RECEIPT: ${{ vars.STAGING_EPHEMERAL_CLEANUP_RECEIPT }}
      CLOUDFLARE_PAGES_PROJECT: buril-lab
      STAGING_KOSHA_CONTENT_MODE: link_only
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_APP_URL: https://burillab.com
      VITE_INTERNAL_API_BASE_URL: https://burillab.com
      VITE_AUTH_REDIRECT_URL: https://burillab.com/auth/callback
      VITE_ENABLE_WASTE_V2: ${{ vars.VITE_ENABLE_WASTE_V2 }}
      VITE_ENABLE_PH_PREDICTION: ${{ vars.VITE_ENABLE_PH_PREDICTION }}
      VITE_ENABLE_CHEMICAL_ENRICHMENT: ${{ vars.VITE_ENABLE_CHEMICAL_ENRICHMENT }}
      VITE_ENABLE_SEARCH_ANALYTICS: ${{ vars.VITE_ENABLE_SEARCH_ANALYTICS }}

    steps:
      - name: Validate the manual confirmation
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REPOSITORY" != "haengjoo123/buril-lab" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deployment must be a manual dispatch from the protected main branch in the canonical repository" >&2
            exit 1
          fi
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "Workflow re-runs are forbidden; create a fresh lease and dispatch a new run" >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a lowercase, full Git SHA" >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_LEASE_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "lease_id must be fresh lowercase hex" >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_STAGING_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "staging_run_id must identify one exact GitHub workflow run" >&2
            exit 1
          fi
          if [[ "$DEPLOY_COMMIT_SHA" != "$GITHUB_SHA" ]]; then
            echo "Production can deploy only the main SHA that dispatched this workflow" >&2
            exit 1
          fi
          if [[ "$DEPLOY_CONFIRMATION" != "DEPLOY buril-lab production $DEPLOY_COMMIT_SHA STAGING $DEPLOY_STAGING_RUN_ID LEASE $DEPLOY_LEASE_ID WITH EPHEMERAL TOKENS" ]]; then
            echo "Production confirmation did not acknowledge the selected SHA, Staging run, lease, and ephemeral-token lifecycle" >&2
            exit 1
          fi

      - name: Check out the exact selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the selected commit is trusted main history
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$DEPLOY_COMMIT_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$DEPLOY_COMMIT_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Capture the clean Production deploy runner boundary
        id: deploy-runner-boundary
        shell: bash
        run: |
          if [[ "${BASH_ENV:-}" != "/dev/null" || "${ENV:-}" != "/dev/null" || -n "${NODE_OPTIONS:-}" || "$PATH" == *$'\n'* || "$PATH" == *$'\r'* ]]; then
            echo "Production deploy runner startup environment is unsafe" >&2
            exit 1
          fi
          echo "trusted_path=$PATH" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Download the exact Production release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/burillab-release-artifact
          merge-multiple: true

      - name: Independently verify the uploaded Production artifact archive digest
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          EXPECTED_ARTIFACT_SERVICE_DIGEST: ${{ needs.build.outputs.artifact_service_digest }}
          RUNNER_TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/git diff --quiet --exit-code
          /usr/bin/git diff --cached --quiet --exit-code
          printf '%s  %s\n' 'e9a649faa2f59ef515b62260abe29f7b0c73393c138223c838ee444a11dd8bbe' scripts/verify-github-artifact-digest.mjs \
            | /usr/bin/sha256sum --check --strict
          node scripts/verify-github-artifact-digest.mjs

      - name: Verify and activate the exact Production release artifact
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/burillab-release-artifact
          EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          EXPECTED_ARTIFACT_SERVICE_DIGEST: ${{ needs.build.outputs.artifact_service_digest }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_ARTIFACT_SERVICE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -d "$ARTIFACT_ROOT/dist"
          test -f "$ARTIFACT_ROOT/.release-artifact.sha256"
          test -s "$ARTIFACT_ROOT/dist/_worker.js/index.js"
          node scripts/verify-pages-functions-routes.mjs "$ARTIFACT_ROOT/dist/_routes.json"
          if [[ -n "$(/usr/bin/find "$ARTIFACT_ROOT" -mindepth 1 -maxdepth 1 ! -name dist ! -name .release-artifact.sha256 -print -quit)" ]] \
            || [[ -n "$(/usr/bin/find "$ARTIFACT_ROOT/dist" -mindepth 1 ! -type f ! -type d -print -quit)" ]]; then
            echo "Downloaded Production artifact contains an unapproved entry" >&2
            exit 1
          fi
          (
            cd "$ARTIFACT_ROOT"
            /usr/bin/find dist -type f -print0 \
              | node "$GITHUB_WORKSPACE/scripts/verify-release-artifact-paths.mjs"
          )
          printf '%s  %s\n' "$EXPECTED_MANIFEST_SHA256" "$ARTIFACT_ROOT/.release-artifact.sha256" \
            | /usr/bin/sha256sum --check --strict
          manifest_count="$(/usr/bin/wc -l < "$ARTIFACT_ROOT/.release-artifact.sha256")"
          file_count="$(/usr/bin/find "$ARTIFACT_ROOT/dist" -type f | /usr/bin/wc -l)"
          [[ "$manifest_count" = "$file_count" ]]
          (
            cd "$ARTIFACT_ROOT"
            /usr/bin/sha256sum --check --strict .release-artifact.sha256
          )
          node scripts/verify-release-manifest.mjs \
            --file "$ARTIFACT_ROOT/dist/release.json" \
            --commit "$DEPLOY_COMMIT_SHA" \
            --environment production
          test ! -e dist
          /usr/bin/mv "$ARTIFACT_ROOT/dist" dist

      - name: Verify the signed current ephemeral lease
        run: node scripts/verify-ephemeral-lease-grant.mjs

      - name: Verify the signed cumulative credential cleanup receipt
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-ephemeral-cleanup-receipt.mjs

      - name: Verify the exact commit passed trusted main quality
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-quality-run.mjs

      - name: Verify the exact approved Staging workflow succeeded
        id: approved-staging-run
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-staging-run.mjs

      - name: Verify the current production Supabase Advisor state
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_HOSTED_ADVISOR_EPHEMERAL_TOKEN }}
        run: |
          node scripts/verify-ephemeral-supabase-lease.mjs
          npm run security:supabase-advisors:hosted -- --environment production

      - name: Verify environment-scoped deployment inputs
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_EPHEMERAL_TOKEN: ${{ secrets.PRODUCTION_PAGES_EPHEMERAL_TOKEN }}
          BURILLAB_RUNTIME_CONFIG_KV_ID: ${{ secrets.BURILLAB_RUNTIME_CONFIG_KV_ID }}
          STAGING_ACCESS_CLIENT_ID: ${{ secrets.STAGING_ACCESS_CLIENT_ID }}
          STAGING_ACCESS_CLIENT_SECRET: ${{ secrets.STAGING_ACCESS_CLIENT_SECRET }}
        run: node scripts/verify-cloudflare-deploy-inputs.mjs

      - name: Resolve the immutable Staging deployment for this SHA
        id: staging-deployment
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_PAGES_EPHEMERAL_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/git diff --quiet --exit-code
          /usr/bin/git diff --cached --quiet --exit-code
          printf '%s  %s\n' 'fb55977e31c33aebcc229c1fef1febba21ba9b6435b59a85fd6805732b8e3317' scripts/cloudflare-api-get.mjs \
            | /usr/bin/sha256sum --check --strict
          node scripts/cloudflare-api-get.mjs \
            --include-status false \
            --url "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/buril-lab-staging/deployments?env=production" \
          | env -u CLOUDFLARE_API_TOKEN node scripts/read-pages-deployment.mjs \
            --file - \
            --commit "$DEPLOY_COMMIT_SHA" \
            --environment staging \
            --project buril-lab-staging \
            --not-before "${{ steps.approved-staging-run.outputs.staging_run_started_at }}" \
            --not-after "${{ steps.approved-staging-run.outputs.staging_run_updated_at }}" \
            --commit-message "${{ steps.approved-staging-run.outputs.staging_commit_message }}"

      - name: Verify all Staging boundaries remain protected by Access
        shell: bash
        run: |
          node scripts/verify-staging-access.mjs "https://staging.burillab.com/release.json?access-probe=$DEPLOY_COMMIT_SHA"
          node scripts/verify-staging-access.mjs "https://buril-lab-staging.pages.dev/release.json?access-probe=$DEPLOY_COMMIT_SHA"
          node scripts/verify-staging-access.mjs "${{ steps.staging-deployment.outputs.deployment_url }}/release.json?access-probe=$DEPLOY_COMMIT_SHA"

      - name: Verify the same SHA is live on protected Staging
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          STAGING_ACCESS_CLIENT_ID: ${{ secrets.STAGING_ACCESS_CLIENT_ID }}
          STAGING_ACCESS_CLIENT_SECRET: ${{ secrets.STAGING_ACCESS_CLIENT_SECRET }}
        run: >-
          node scripts/verify-release-manifest.mjs
          --url "https://staging.burillab.com/release.json?commit=$DEPLOY_COMMIT_SHA"
          --commit "$DEPLOY_COMMIT_SHA"
          --environment staging

      - name: Verify the Pages apex serves the same Staging SHA
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          STAGING_ACCESS_CLIENT_ID: ${{ secrets.STAGING_ACCESS_CLIENT_ID }}
          STAGING_ACCESS_CLIENT_SECRET: ${{ secrets.STAGING_ACCESS_CLIENT_SECRET }}
        run: >-
          node scripts/verify-release-manifest.mjs
          --url "https://buril-lab-staging.pages.dev/release.json?commit=$DEPLOY_COMMIT_SHA"
          --commit "$DEPLOY_COMMIT_SHA"
          --environment staging

      - name: Verify the immutable deployment URL serves the same Staging SHA
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          STAGING_ACCESS_CLIENT_ID: ${{ secrets.STAGING_ACCESS_CLIENT_ID }}
          STAGING_ACCESS_CLIENT_SECRET: ${{ secrets.STAGING_ACCESS_CLIENT_SECRET }}
        run: >-
          node scripts/verify-release-manifest.mjs
          --url "${{ steps.staging-deployment.outputs.deployment_url }}/release.json?commit=$DEPLOY_COMMIT_SHA"
          --commit "$DEPLOY_COMMIT_SHA"
          --environment staging

      - name: Verify Pages control-plane safeguards before deployment
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_PAGES_EPHEMERAL_TOKEN }}
          BURILLAB_RUNTIME_CONFIG_KV_ID: ${{ secrets.BURILLAB_RUNTIME_CONFIG_KV_ID }}
          VERIFY_CURRENT_RUNTIME_BINDING: "false"
        run: npm run ops:verify

      - name: Recheck high and critical runtime advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Recheck the exact commit still passes trusted main quality
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-quality-run.mjs

      - name: Recheck the exact approved Staging workflow still succeeded
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-staging-run.mjs

      - name: Recheck that production still targets the current main tip
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$DEPLOY_COMMIT_SHA"

      - name: Recheck the current production Supabase Advisor state immediately before deployment
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_HOSTED_ADVISOR_EPHEMERAL_TOKEN }}
        run: |
          node scripts/verify-ephemeral-supabase-lease.mjs
          npm run security:supabase-advisors:hosted -- --environment production

      - name: Recheck the active production Pages token and deployment inputs at the mutation boundary
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          EPHEMERAL_LEASE_MIN_REMAINING_SECONDS: "600"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_EPHEMERAL_TOKEN: ${{ secrets.PRODUCTION_PAGES_EPHEMERAL_TOKEN }}
          BURILLAB_RUNTIME_CONFIG_KV_ID: ${{ secrets.BURILLAB_RUNTIME_CONFIG_KV_ID }}
          STAGING_ACCESS_CLIENT_ID: ${{ secrets.STAGING_ACCESS_CLIENT_ID }}
          STAGING_ACCESS_CLIENT_SECRET: ${{ secrets.STAGING_ACCESS_CLIENT_SECRET }}
        run: node scripts/verify-cloudflare-deploy-inputs.mjs

      - name: Recheck the signed production cleanup receipt at the Pages mutation boundary
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-ephemeral-cleanup-receipt.mjs

      - name: Recheck the signed production lease with ten minutes remaining for Pages mutation
        env:
          EPHEMERAL_LEASE_MIN_REMAINING_SECONDS: "600"
        run: node scripts/verify-ephemeral-lease-grant.mjs --minimum-remaining-seconds 600

      - name: Materialize the production Wrangler config after final guards
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          BURILLAB_PRODUCTION_RUNTIME_CONFIG_KV_ID: ${{ secrets.BURILLAB_RUNTIME_CONFIG_KV_ID }}
        run: >-
          /usr/bin/timeout --signal=TERM --kill-after=5s 30s
          node scripts/render-wrangler-config.mjs
          --input wrangler.jsonc
          --output wrangler.production.generated.jsonc
          --pages-deploy-redirect .wrangler/deploy/config.json

      - name: Deploy the exact commit to production Pages
        id: pages-deploy-command
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_PAGES_EPHEMERAL_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/burillab-production-pages-deploy.jsonl
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/git diff --quiet --exit-code
          /usr/bin/git diff --cached --quiet --exit-code
          printf '%s  %s\n' 'f6f7f7f615d022fd971e0df2b39c8e6e6be2dde23efdb6e7f604c90b4041d299' scripts/verify-wrangler-pages-deploy-output.mjs \
            | /usr/bin/sha256sum --check --strict
          test -x "$GITHUB_WORKSPACE/node_modules/.bin/wrangler"
          test -s dist/_worker.js/index.js
          test -d functions
          test ! -e "$WRANGLER_OUTPUT_FILE_PATH"
          /usr/bin/timeout --signal=TERM --kill-after=5s 30s git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$DEPLOY_COMMIT_SHA"
          test "$(git rev-parse origin/main)" = "$DEPLOY_COMMIT_SHA"
          deploy_message="approved production run $GITHUB_RUN_ID lease $DEPLOY_LEASE_ID"
          deploy_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          disabled_functions="$RUNNER_TEMP/burillab-pages-functions-$GITHUB_RUN_ID"
          test ! -e "$disabled_functions"
          /usr/bin/mv functions "$disabled_functions"
          restore_functions() {
            if [[ -d "$disabled_functions" && ! -e functions ]]; then
              /usr/bin/mv "$disabled_functions" functions
            fi
          }
          trap restore_functions EXIT
          test ! -e functions
          env -u CLOUDFLARE_API_TOKEN \
            /usr/bin/timeout --signal=TERM --kill-after=5s 15s \
              node scripts/verify-ephemeral-lease-grant.mjs --minimum-remaining-seconds 600
          /usr/bin/timeout --signal=TERM --kill-after=15s 540s \
            "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" pages deploy dist \
              --project-name "$CLOUDFLARE_PAGES_PROJECT" \
              --branch main \
              --commit-hash "$DEPLOY_COMMIT_SHA" \
              --commit-message "$deploy_message" \
              --commit-dirty=false \
              --no-bundle
          restore_functions
          trap - EXIT
          test -d functions
          env -u CLOUDFLARE_API_TOKEN node scripts/verify-wrangler-pages-deploy-output.mjs \
            --file "$WRANGLER_OUTPUT_FILE_PATH" \
            --commit "$DEPLOY_COMMIT_SHA" \
            --environment production \
            --project "$CLOUDFLARE_PAGES_PROJECT" \
            --started-at "$deploy_started_at"

      - name: Resolve the exact immutable production deployment
        id: production-deployment
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_PAGES_EPHEMERAL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/git diff --quiet --exit-code
          /usr/bin/git diff --cached --quiet --exit-code
          printf '%s  %s\n' 'fb55977e31c33aebcc229c1fef1febba21ba9b6435b59a85fd6805732b8e3317' scripts/cloudflare-api-get.mjs \
            | /usr/bin/sha256sum --check --strict
          evidence_found=false
          for attempt in 1 2 3 4 5 6; do
            if node scripts/cloudflare-api-get.mjs \
              --include-status false \
              --url "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT/deployments?env=production" \
              | env -u CLOUDFLARE_API_TOKEN node scripts/read-pages-deployment.mjs \
                --file - \
                --commit "$DEPLOY_COMMIT_SHA" \
                --environment production \
                --project "$CLOUDFLARE_PAGES_PROJECT" \
                --deployment-id "${{ steps.pages-deploy-command.outputs.deployment_id }}" \
                --deployment-url "${{ steps.pages-deploy-command.outputs.deployment_url }}" \
                --not-before "${{ steps.pages-deploy-command.outputs.deployment_started_at }}" \
                --commit-message "approved production run $GITHUB_RUN_ID lease $DEPLOY_LEASE_ID"; then
              evidence_found=true
              break
            fi
            if [[ "$attempt" -lt 6 ]]; then sleep 5; fi
          done
          if [[ "$evidence_found" != true ]]; then
            echo "The exact production Pages deployment did not become verifiable." >&2
            exit 1
          fi

      - name: Verify the immutable production deployment serves the same SHA
        run: >-
          node scripts/verify-release-manifest.mjs
          --url "${{ steps.production-deployment.outputs.deployment_url }}/release.json?commit=$DEPLOY_COMMIT_SHA"
          --commit "$DEPLOY_COMMIT_SHA"
          --environment production
          --retries 6
          --retry-delay-ms 5000

      - name: Verify the public production release manifest
        run: >-
          node scripts/verify-release-manifest.mjs
          --url "https://burillab.com/release.json?commit=$DEPLOY_COMMIT_SHA"
          --commit "$DEPLOY_COMMIT_SHA"
          --environment production
          --retries 6
          --retry-delay-ms 5000

      - name: Verify both applied KV bindings remain isolated
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.deploy-runner-boundary.outputs.trusted_path }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_PAGES_EPHEMERAL_TOKEN }}
          BURILLAB_RUNTIME_CONFIG_KV_ID: ${{ secrets.BURILLAB_RUNTIME_CONFIG_KV_ID }}
          VERIFY_CURRENT_RUNTIME_BINDING: "true"
        run: npm run ops:verify

      - name: Record deployment evidence
        shell: bash
        run: |
          echo "- Environment: production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pages project: $CLOUDFLARE_PAGES_PROJECT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release commit: \`$DEPLOY_COMMIT_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Record cleanup pending before the next lease
        if: always()
        shell: bash
        run: |
          echo "::warning::The next lease is blocked until every temporary GitHub secret is absent, both provider tokens are inactive, and the cleanup receipt matches this run."
          echo "- Cleanup pending: remove PRODUCTION_PAGES_EPHEMERAL_TOKEN and SUPABASE_HOSTED_ADVISOR_EPHEMERAL_TOKEN; revoke both provider tokens; verify inactivity; and record the receipt for this exact run." >> "$GITHUB_STEP_SUMMARY"
