name: Verify staging ephemeral credentials

run-name: Verify staging ephemeral credential injection ${{ inputs.commit_sha }} (probe=${{ inputs.probe_id }})

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Lowercase full SHA at the current main tip
        required: true
        type: string
      probe_id:
        description: Fresh 32-character lowercase hex credential-injection probe identifier
        required: true
        type: string
      confirmation:
        description: Type "VERIFY buril-lab-staging credential injection <SHA> PROBE <PROBE>"
        required: true
        type: string
      probe_grant:
        description: Signed public-safe credential-injection probe attestation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact environment-secret injection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    env:
      BASH_ENV: /dev/null
      ENV: /dev/null
      NODE_OPTIONS: ""
      DEPLOY_ENVIRONMENT: staging
      DEPLOY_COMMIT_SHA: ${{ inputs.commit_sha }}
      DEPLOY_PROBE_ID: ${{ inputs.probe_id }}
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
      EPHEMERAL_CREDENTIAL_PROBE_GRANT: ${{ inputs.probe_grant }}
      EPHEMERAL_CLEANUP_RECEIPT: ${{ vars.EPHEMERAL_CLEANUP_RECEIPT }}

    steps:
      - name: Validate the Staging credential-injection probe request
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REPOSITORY" != "haengjoo123/buril-lab" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Staging credential-injection probes must be dispatched from protected main" >&2
            exit 1
          fi
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "Workflow re-runs are forbidden; dispatch a fresh probe" >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_COMMIT_SHA" =~ ^[0-9a-f]{40}$ || "$DEPLOY_COMMIT_SHA" != "$GITHUB_SHA" ]]; then
            echo "Credential-injection probe must target the exact lowercase main SHA that dispatched it" >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_PROBE_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "probe_id must be fresh lowercase hex" >&2
            exit 1
          fi
          if [[ "$DEPLOY_CONFIRMATION" != "VERIFY buril-lab-staging credential injection $DEPLOY_COMMIT_SHA PROBE $DEPLOY_PROBE_ID" ]]; then
            echo "Credential-injection probe confirmation did not acknowledge the exact SHA and probe" >&2
            exit 1
          fi

      - name: Check out the exact Staging probe commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the probe commit is current main
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$DEPLOY_COMMIT_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$DEPLOY_COMMIT_SHA"

      - name: Set up Node.js for the credential-injection probe
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Capture the clean credential-injection probe runner boundary
        id: credential-probe-runner-boundary
        shell: bash
        run: |
          if [[ "${BASH_ENV:-}" != "/dev/null" || "${ENV:-}" != "/dev/null" || -n "${NODE_OPTIONS:-}" || "$PATH" == *$'\n'* || "$PATH" == *$'\r'* ]]; then
            echo "Credential-injection probe runner startup environment is unsafe" >&2
            exit 1
          fi
          echo "trusted_path=$PATH" >> "$GITHUB_OUTPUT"

      - name: Verify exact environment-secret injection
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          NODE_OPTIONS: ""
          PATH: ${{ steps.credential-probe-runner-boundary.outputs.trusted_path }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_HOSTED_ADVISOR_EPHEMERAL_TOKEN }}
          PAGES_EPHEMERAL_TOKEN: ${{ secrets.STAGING_PAGES_EPHEMERAL_TOKEN }}
        run: node scripts/verify-ephemeral-credential-injection.mjs --mode probe
