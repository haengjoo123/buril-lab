name: iOS TestFlight (deferred)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ios-testflight-deferred
  cancel-in-progress: true

jobs:
  deferred:
    name: Refuse deferred App Store deployment
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain the release boundary
        shell: bash
        run: |
          echo "TestFlight and App Store deployment remain outside the approved operations-hardening scope." >&2
          echo "No repository or environment secret was loaded." >&2
          exit 1
